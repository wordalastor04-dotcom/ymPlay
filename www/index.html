<!DOCTYPE html>
<html lang="es" data-theme="dark" data-palette="ocean">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ymPlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="custom-bg"></div>

  <!-- BANNER DE ACTUALIZACIÓN -->
  <div id="update-banner" class="update-banner">
    <span>✨ ¡Nueva actualización disponible!</span>
    <button id="downloadUpdateBtn">Descargar</button>
    <button id="closeUpdateBtn" class="close-update">✕</button>
  </div>

  <!-- MENÚ LATERAL -->
  <div id="side-menu" class="side-menu">
    <div class="menu-header">
      <h2>Opciones</h2>
      <button class="icon-btn" id="closeMenuBtn">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <ul class="menu-list">
      <!-- BOTÓN PARA LA BURBUJA FLOTANTE -->
      <li><button id="btnToggleBubble" style="color: var(--accent); border-color: var(--accent);">🫧 Activar Isla Dinámica</button></li>
      
      <li><button id="sortNewestBtn">⬇️ Más recientes primero</button></li>
      <li><button id="sortOldestBtn">⬆️ Más antiguas primero</button></li>
      <li><button id="sortTitleBtn">🔤 Orden alfabético (A-Z)</button></li>
      <li>
        <label class="menu-btn" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
          🖼️ Cambiar Fondo
          <input type="file" id="bgInput" accept="image/*" style="display: none;">
        </label>
      </li>
    </ul>
    <div style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px;">
      <label style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; display: block;">Desenfoque de fondo:</label>
      <input type="range" id="bgBlurSlider" min="0" max="20" value="0" step="1" style="width: 100%; accent-color: var(--accent);">
    </div>
  </div>
  <div id="menu-overlay" class="menu-overlay"></div>

  <div class="player-app">
    
    <!-- PANTALLA PRINCIPAL -->
    <div id="screen-main" style="display: flex; flex-direction: column; height: 100%;">
      
      <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="icon-btn" id="menuBtn">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          </button>
          <h1 id="appTitle">ymPlay</h1>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="themeToggle" title="Cambiar modo">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          </button>
        </div>
      </div>

      <div class="palette-switcher">
        <div class="palette-dot active" data-color="ocean"></div>
        <div class="palette-dot" data-color="sunset"></div>
        <div class="palette-dot" data-color="forest"></div>
        <div class="palette-dot" data-color="mono"></div>
      </div>

      <div class="tabs-container" id="main-tabs">
        <button class="tab-btn-main active" data-view="songs">Canciones</button>
        <button class="tab-btn-main" data-view="playlists">Playlists</button>
      </div>

      <div id="view-songs" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div style="display: flex; justify-content: center; margin-bottom: 15px;">
          <button id="btnEscanear" class="small-update-btn">Actualizar Música</button>
        </div>
        <div class="playlist-section" style="flex: 1; overflow-y: auto;">
          <h3 style="padding: 0 10px;">Canciones <span id="trackCount" style="font-weight:400;font-size:11px;color:var(--text-secondary);">Cargando...</span></h3>
          <ul class="playlist" id="playlist"></ul>
        </div>
      </div>

      <div id="view-playlists" style="flex: 1; display: none; flex-direction: column; overflow-y: auto;">
        <button id="btnNewPlaylist" class="add-playlist-btn"><span>+</span> Crear nueva Playlist</button>
        <ul class="playlist" id="playlists-list" style="margin-top: 15px;"></ul>
      </div>

      <div id="view-playlist-detail" style="flex: 1; display: none; flex-direction: column; overflow: hidden;">
        <div class="top-bar" style="margin-bottom: 10px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <button class="icon-btn" id="backToPlaylistsBtn">
              <svg viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7z"/></svg>
            </button>
            <h2 id="playlistDetailTitle" style="font-size: 18px;">Playlist</h2>
          </div>
        </div>
        <button id="btnAddSongsToPlaylist" class="small-update-btn" style="margin: 0 auto 15px auto; display: block;">+ Añadir canciones</button>
        <div class="playlist-section" style="flex: 1; overflow-y: auto;">
          <ul class="playlist" id="playlist-detail-list"></ul>
        </div>
      </div>

    </div>

    <!-- PANTALLA REPRODUCTOR -->
    <div id="screen-player" style="display: none; flex-direction: column; height: 100%;">
      <div class="top-bar" style="justify-content: flex-start; margin-bottom: 10px;">
        <button class="icon-btn" id="backToListBtn" style="margin-right: 10px;">
          <svg viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7z"/></svg>
        </button>
        <h1 style="font-size: 16px;">Reproduciendo</h1>
      </div>

      <div class="cover-container">
        <div class="cover-placeholder">🎵</div>
        <img id="coverImg" src="" alt="Portada" style="display:none;" />
        <span class="cover-badge" id="coverBadge">Pista</span>
      </div>

      <div class="song-info">
        <div class="song-title" id="songTitle">Selecciona una canción</div>
        <div class="song-artist" id="songArtist">—</div>
      </div>

      <div class="progress-section">
        <div class="progress-bar-wrap" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="time-labels"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ctrl-btn play-btn" id="playBtn"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="ctrl-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>

      <div class="tab-bar" style="margin-top: 10px;">
        <button class="tab-btn active" data-tab="lyrics">Letras</button>
        <button class="tab-btn" data-tab="eq">Ecualizador</button>
      </div>
      <div class="tab-content active" id="tab-lyrics"><div class="lyrics-box" id="lyricsBox"><p>Sin letras disponibles</p></div></div>
      <div class="tab-content" id="tab-eq">
        <div class="eq-container">
          <div class="eq-presets" id="eqPresets">
            <button class="preset-btn active" data-preset="flat">Plano</button>
            <button class="preset-btn" data-preset="rock">Rock</button>
            <button class="preset-btn" data-preset="pop">Pop</button>
            <button class="preset-btn" data-preset="jazz">Jazz</button>
            <button class="preset-btn" data-preset="vocal">Voz</button>
          </div>
          <div class="eq-sliders" id="eqSliders">
            <div class="eq-band"><label>60Hz</label><input type="range" min="-12" max="12" value="0" data-freq="60" /></div>
            <div class="eq-band"><label>250Hz</label><input type="range" min="-12" max="12" value="0" data-freq="250" /></div>
            <div class="eq-band"><label>1kHz</label><input type="range" min="-12" max="12" value="0" data-freq="1000" /></div>
            <div class="eq-band"><label>4kHz</label><input type="range" min="-12" max="12" value="0" data-freq="4000" /></div>
            <div class="eq-band"><label>14kHz</label><input type="range" min="-12" max="12" value="0" data-freq="14000" /></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODALES -->
  <div id="modal-new-playlist" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Nueva Playlist</h3>
      <input type="text" id="newPlaylistName" placeholder="Nombre..." maxlength="30">
      <div class="modal-actions">
        <button id="cancelNewPlaylist" class="btn-secondary">Cancelar</button>
        <button id="saveNewPlaylist" class="btn-primary">Crear</button>
      </div>
    </div>
  </div>

  <div id="modal-select-songs" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="height: 80%; display: flex; flex-direction: column;">
      <h3>Añadir canciones</h3>
      <ul id="all-songs-options" class="playlist" style="flex: 1; overflow-y: auto; margin-bottom: 15px;"></ul>
      <button id="closeAddSongsModal" class="btn-primary" style="width: 100%;">Listo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Capacitor Sync
        run: npx cap sync android

      # --- AQUÍ INYECTAMOS TU FIRMA DIGITAL EXISTENTE ---
      - name: Decode Keystore
        run: |
          # Decodifica el archivo base64 de GitHub y lo guarda en la carpeta de Android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          
          # Compila usando tu firma y tus contraseñas exactas desde GitHub Secrets
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ymPlay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

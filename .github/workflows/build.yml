name: Compilar APK Firmado
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add audio permissions to Manifest
        run: |
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/><\/manifest>/' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Extract signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.p12

      - name: Sign APK with jarsigner
        run: |
          jarsigner -keystore android/release.p12 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -signedjar android/app/build/outputs/apk/debug/app-debug-signed.apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ymPlay-APK
          path: android/app/build/outputs/apk/debug/app-debug-signed.apk

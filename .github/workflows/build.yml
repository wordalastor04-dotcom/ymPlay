name: Compilar APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Instalar dependencias
        run: npm install
      - name: Añadir plataforma Android
        run: npx cap add android
      - name: Añadir permisos de audio al Manifest
        run: |
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/><\/manifest>/' android/app/src/main/AndroidManifest.xml
      - name: Sincronizar Capacitor
        run: npx cap sync
      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v3
        with:
          name: ymPlay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

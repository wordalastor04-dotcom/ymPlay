name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Crea la carpeta nativa de Android desde cero
      - name: Add Android Platform
        run: npx cap add android

      # 2. Convierte tu icon.png en todos los tamaños que Android necesita
      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      # 3. Sincroniza tus archivos web y plugins a la carpeta Android
      - name: Capacitor Sync
        run: npx cap sync android

      # 4. Compila el APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Sube el APK para que lo descargues
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ymPlay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

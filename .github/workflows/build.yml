name: Compilar APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Instalar dependencias
        run: npm install
        
      - name: Añadir plataforma Android
        run: npx cap add android
        
      - name: Añadir permisos de audio al Manifest
        run: |
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/><\/manifest>/' android/app/src/main/AndroidManifest.xml
          
      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.p12
          
      - name: Configurar Firma en build.gradle
        run: |
          sed -i 's/buildTypes {/signingConfigs {\n        release {\n            storeFile file("..\/release.p12")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n            storeType "PKCS12"\n        }\n    }\n    buildTypes {/' android/app/build.gradle
          sed -i 's/buildTypes {/buildTypes {\n        debug {\n            signingConfig signingConfigs.release\n        }/' android/app/build.gradle
          
      - name: Sincronizar Capacitor
        run: npx cap sync
        
      - name: Compilar APK Firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug
          
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ymPlay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

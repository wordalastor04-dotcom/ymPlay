name: Compilar APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Instalar dependencias
        run: npm install
        
      - name: Añadir plataforma Android
        run: npx cap add android
        
      - name: Añadir permisos de audio al Manifest
        run: |
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/><\/manifest>/' android/app/src/main/AndroidManifest.xml
          
      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.p12
          
      - name: Sincronizar Capacitor
        run: npx cap sync
        
      - name: Compilar APK Firmado
        run: |
          cd android
          ./gradlew assembleDebug \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release.p12 \
          -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ymPlay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

<!DOCTYPE html>
<html lang="es" data-theme="dark" data-palette="ocean">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mi Reproductor Personalizable</title>
  
  <!-- ENLACE AL CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo personalizado (imagen) -->
  <div id="custom-bg"></div>

  <div class="player-app">
    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
      <h1>🎧 Mi Player</h1>
      <div class="top-actions">
        <button class="icon-btn" id="themeToggle" title="Cambiar modo">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <button class="icon-btn" id="bgResetBtn" title="Quitar fondo" style="display:none;">
          <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>

    <!-- SELECTOR DE PALETA -->
    <div class="palette-switcher">
      <div class="palette-dot active" data-color="ocean" title="Océano"></div>
      <div class="palette-dot" data-color="sunset" title="Atardecer"></div>
      <div class="palette-dot" data-color="forest" title="Bosque"></div>
      <div class="palette-dot" data-color="mono" title="Monocromo"></div>
    </div>

    <!-- PORTADA -->
    <div class="cover-container">
      <div class="cover-placeholder">🎵</div>
      <img id="coverImg" src="" alt="Portada" style="display:none;" />
      <span class="cover-badge" id="coverBadge">Sin pista</span>
    </div>

    <!-- INFO DE LA CANCIÓN -->
    <div class="song-info">
      <div class="song-title" id="songTitle">Selecciona una canción</div>
      <div class="song-artist" id="songArtist">—</div>
    </div>

    <!-- BARRA DE PROGRESO -->
    <div class="progress-section">
      <div class="progress-bar-wrap" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-labels">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <!-- CONTROLES DE REPRODUCCIÓN -->
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="Anterior">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn" title="Reproducir">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Siguiente">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>

    <!-- PESTAÑAS: LETRAS / ECUALIZADOR -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="lyrics">Letras</button>
      <button class="tab-btn" data-tab="eq">Ecualizador</button>
    </div>

    <!-- CONTENIDO: LETRAS -->
    <div class="tab-content active" id="tab-lyrics">
      <div class="lyrics-box" id="lyricsBox">
        <p>Sin letras disponibles</p>
      </div>
    </div>

    <!-- CONTENIDO: ECUALIZADOR -->
    <div class="tab-content" id="tab-eq">
      <div class="eq-container">
        <div class="eq-presets" id="eqPresets">
          <button class="preset-btn active" data-preset="flat">Plano</button>
          <button class="preset-btn" data-preset="rock">Rock</button>
          <button class="preset-btn" data-preset="pop">Pop</button>
          <button class="preset-btn" data-preset="jazz">Jazz</button>
          <button class="preset-btn" data-preset="vocal">Voz</button>
        </div>
        <div class="eq-sliders" id="eqSliders">
          <div class="eq-band"><label>60Hz</label><input type="range" min="-12" max="12" value="0" data-freq="60" /></div>
          <div class="eq-band"><label>250Hz</label><input type="range" min="-12" max="12" value="0" data-freq="250" /></div>
          <div class="eq-band"><label>1kHz</label><input type="range" min="-12" max="12" value="0" data-freq="1000" /></div>
          <div class="eq-band"><label>4kHz</label><input type="range" min="-12" max="12" value="0" data-freq="4000" /></div>
          <div class="eq-band"><label>14kHz</label><input type="range" min="-12" max="12" value="0" data-freq="14000" /></div>
        </div>
      </div>
    </div>

    <!-- LISTA DE REPRODUCCIÓN -->
    <div class="playlist-section">
      <h3>Lista <span id="trackCount" style="font-weight:400;font-size:11px;color:var(--text-secondary);">0 pistas</span></h3>
      <ul class="playlist" id="playlist"></ul>
    </div>

    <!-- ACCIONES INFERIORES -->
    <div class="bottom-actions">
      <label class="file-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4v12m0 0-4-4m4 4 4-4M4 20h16"/></svg>
        Añadir música
        <input type="file" id="fileInput" accept="audio/*" multiple />
      </label>
      <label class="bg-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v16H4z"/></svg>
        Fondo
        <input type="file" id="bgInput" accept="image/*" />
      </label>
      <label class="bg-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v18M3 12h18"/></svg>
        Letras
        <input type="file" id="lrcInput" accept=".lrc,.txt" />
      </label>
    </div>
  </div>

  <!-- ENLACE AL JAVASCRIPT -->
  <script src="script.js"></script>
</body>
</html>
